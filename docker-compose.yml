services:
  postgres:
    image: postgres:16-alpine
    container_name: infinito_registration_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: infinito_dev_pwd
      POSTGRES_DB: infinito_dev
    ports:
      - "5433:5432"
    volumes:
      - infinito_registration_postgres_data:/var/lib/postgresql/data

volumes:
  infinito_registration_postgres_data:
